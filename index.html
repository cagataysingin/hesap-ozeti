<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Dünyamız</title>
    <!-- PeerJS için CDN -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #ff6584;
            --secondary: #6c63ff;
            --bg-color: #ffe6eb;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 450px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
        h1, h2 { text-align: center; color: var(--primary); margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: var(--secondary); }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; margin-top: 10px; text-align: center; outline: none; }
        input:focus { border-color: var(--primary); }
        .hidden { display: none !important; }
        
        /* Sayaçlar */
        .timers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .timer-card { background: #fff0f3; padding: 12px; border-radius: 12px; text-align: center; border: 1px dashed var(--primary); }
        .timer-card h3 { font-size: 14px; color: #555; margin-bottom: 4px; }
        .timer-card p { font-size: 16px; font-weight: bold; color: var(--primary); }

        /* Sekmeler & Menü */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        
        /* Chat */
        .chat-box { height: 180px; border: 1px solid #ddd; border-radius: 10px; overflow-y: scroll; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; background: #fafafa; }
        .message { padding: 8px 12px; border-radius: 10px; max-width: 80%; font-size: 14px; word-break: break-word; }
        .message.sent { background: #ffccd5; align-self: flex-end; color: #333; }
        .message.received { background: #e2e2e2; align-self: flex-start; color: #333; }
        .chat-input-area { display: flex; gap: 5px; }
        .chat-input-area input { margin-top: 0; text-align: left; }
        .chat-input-area .btn { margin-top: 0; width: 80px; }

        /* Oyunlar Ortak Alanı */
        .game-area { text-align: center; padding: 10px 0; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .option-btn { width: 100%; padding: 15px; background: #f0f0f0; border: 2px solid #ddd; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: left; }
        .option-btn:hover { background: #ffe0e6; border-color: var(--primary); }

        /* Tic-Tac-Toe (XOX) Tahtası */
        .tictactoe-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .ttt-cell { aspect-ratio: 1; background: #f9f9f9; border: 2px solid #ddd; border-radius: 10px; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--primary); }
        .ttt-cell:hover { background: #ffe0e6; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div class="container" id="login-screen">
        <h1>Bizim Dünyamız 💖</h1>
        
        <!-- SAYAÇLAR -->
        <div class="timers">
            <div class="timer-card">
                <h3>Sevgililik Süremiz 🥰</h3>
                <p id="relationship-timer">Yükleniyor...</p>
            </div>
            <div class="timer-card">
                <h3>Zeynep'in Doğum Gününe Kalan 🎂</h3>
                <p id="zeynep-timer">Yükleniyor...</p>
            </div>
            <div class="timer-card">
                <h3>Çağatay'ın Doğum Gününe Kalan 🎉</h3>
                <p id="cagatay-timer">Yükleniyor...</p>
            </div>
        </div>

        <button class="btn" onclick="createRoom()">Oda Kur 🔑</button>
        <input type="text" id="room-input" placeholder="4 Haneli Oda Kodu">
        <button class="btn btn-secondary" onclick="joinRoom()">Odaya Katıl 🚀</button>
        <p id="connection-status" style="text-align: center; margin-top: 10px; font-size: 14px; color: #666;"></p>
    </div>

    <!-- OYUN VE CHAT ANA PANELİ -->
    <div class="container hidden" id="main-screen">
        <h2 id="room-info">Oda Bağlandı ✨</h2>
        
        <div class="menu-grid">
            <button class="btn" onclick="switchTab('chat')">Canlı Chat 💬</button>
            <button class="btn btn-secondary" onclick="switchTab('onedio')">Onedio Testi 🧪</button>
            <button class="btn" style="background:#28a745;" onclick="switchTab('kelime')">Kelime Türet ✍️</button>
            <button class="btn" style="background:#e67e22;" onclick="switchTab('tictactoe')">XOX Oyunu ❌</button>
        </div>

        <!-- CHAT SEKMESİ -->
        <div id="tab-chat" class="tab-content hidden" style="margin-top: 15px;">
            <div class="chat-box" id="chat-box"></div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Mesaj yaz...">
                <button class="btn" onclick="sendMessage()">Gönder</button>
            </div>
        </div>

        <!-- ONEDİO TEST SEKMESİ -->
        <div id="tab-onedio" class="tab-content" style="margin-top: 15px;">
            <h3 id="test-title">İlişki Testi 💖</h3>
            <div class="game-area">
                <p id="question-text" style="font-weight: bold; margin-bottom: 15px; font-size: 16px; color:#444;"></p>
                <div class="options-container" id="test-options"></div>
            </div>
        </div>

        <!-- KELİME TÜRETME SEKMESİ -->
        <div id="tab-kelime" class="tab-content hidden" style="margin-top: 15px;">
            <h3>Son Heceden Kelime Türet</h3>
            <div class="game-area">
                <p id="kelime-info" style="font-size: 14px; margin-bottom: 10px; color:#555;">Mevcut Kelime:</p>
                <h2 id="current-word" style="color: var(--secondary); background:#f0f0f5; padding:10px; border-radius:8px;">Henüz kelime yok</h2>
                <input type="text" id="word-input" placeholder="Son heceyle başlayan kelime yaz...">
                <button class="btn" onclick="sendWord()">Kelimeyi Gönder</button>
            </div>
        </div>

        <!-- TİC-TAC-TOE (XOX) SEKMESİ -->
        <div id="tab-tictactoe" class="tab-content hidden" style="margin-top: 15px;">
            <h3>XOX Kapışması ❌⭕</h3>
            <div class="game-area">
                <p id="ttt-status" style="font-weight: bold; margin-bottom: 10px; color: var(--secondary);">Sıra sende!</p>
                <div class="tictactoe-board" id="ttt-board">
                    <div class="ttt-cell" onclick="makeMove(0)"></div>
                    <div class="ttt-cell" onclick="makeMove(1)"></div>
                    <div class="ttt-cell" onclick="makeMove(2)"></div>
                    <div class="ttt-cell" onclick="makeMove(3)"></div>
                    <div class="ttt-cell" onclick="makeMove(4)"></div>
                    <div class="ttt-cell" onclick="makeMove(5)"></div>
                    <div class="ttt-cell" onclick="makeMove(6)"></div>
                    <div class="ttt-cell" onclick="makeMove(7)"></div>
                    <div class="ttt-cell" onclick="makeMove(8)"></div>
                </div>
                <button class="btn btn-secondary" onclick="resetTTT()">Yeniden Başlat</button>
            </div>
        </div>
    </div>

    <script>
        // SAYAÇLAR
        function updateTimers() {
            const relDate = new Date('2025-10-25T00:00:00');
            const now = new Date();
            let diff = now - relDate;
            
            if(diff < 0) {
                document.getElementById('relationship-timer').innerText = "Başlangıç bekleniyor ❤️";
            } else {
                let days = Math.floor(diff / (1000 * 60 * 60 * 24));
                let hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                document.getElementById('relationship-timer').innerText = `${days} gün ${hours} saat oldu ✨`;
            }

            calcBirthday('zeynep-timer', 0, 7);
            calcBirthday('cagatay-timer', 8, 1);
        }

        function calcBirthday(elementId, month, day) {
            const now = new Date();
            let year = now.getFullYear();
            let bday = new Date(year, month, day);
            if (now > bday) bday.setFullYear(year + 1);
            let diff = bday - now;
            let days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById(elementId).innerText = `${days} gün kaldı 🎈`;
        }
        setInterval(updateTimers, 1000);
        updateTimers();

        // PEERJS BAĞLANTI MANTIĞI
        let peer, conn;
        let isHost = false;

        function createRoom() {
            let roomId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer('cagatay-zeynep-' + roomId);
            
            peer.on('open', (id) => {
                isHost = true;
                document.getElementById('connection-status').innerText = "Oda Kuruldu! Kod: " + roomId + " (Sevgiline söyle)";
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('room-info').innerText = "Odaya Bağlanıldı! 💖";
            });
        }

        function joinRoom() {
            let roomId = document.getElementById('room-input').value.trim();
            if(roomId.length !== 4) { alert("Lütfen 4 haneli oda kodunu gir!"); return; }
            
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect('cagatay-zeynep-' + roomId);
                setupConnection();
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('room-info').innerText = "Odaya Katılındı! 💖";
            });
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'chat') {
                    appendMessage(data.msg, 'received');
                } else if (data.type === 'kelime') {
                    updateWordGame(data.word);
                } else if (data.type === 'ttt') {
                    receiveMove(data.index, data.playerSymbol);
                } else if (data.type === 'ttt-reset') {
                    resetTTTBoardLocally();
                }
            });
        }

        // SEKME DEĞİŞTİRME
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');
        }

        // CHAT SİSTEMİ
        function sendMessage() {
            let input = document.getElementById('msg-input');
            let msg = input.value.trim();
            if(!msg) return;
            appendMessage(msg, 'sent');
            conn.send({ type: 'chat', msg: msg });
            input.value = false;
            input.value = '';
        }

        function appendMessage(msg, type) {
            let box = document.getElementById('chat-box');
            let div = document.createElement('div');
            div.className = 'message ' + type;
            div.innerText = msg;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // ONEDİO TESTLERİ
        const onedioQuestions = [
            { q: "Tartıştıktan sonra genelde ilk kim alttan alır? 🥺", options: ["Hemen yumuşayan taraf ben olurum", "Önce biraz trip atılır, sonra barışılır", "Kesinlikle o alttan alır"] },
            { q: "Dışarıda yemek yiyeceksiniz, mekan seçimi kime kalır? 🍕", options: ["Direkt benim dediğim yere gidilir", "O ne isterse ortak karar verilir", "Sürekli 'ne fark eder' diye birbirimize sorarız"] },
            { q: "Gelecekte beraber yaşayacağınız evde kesinlikle olmalı dediğiniz şey? 🏡", options: ["Devasa bir oyun/sinema köşesi", "Koca bir kütüphane ve kahve makinesi", "Sonsuz huzur ve konforlu bir yatak"] }
        ];
        let currentQIndex = 0;

        function loadOnedioTest() {
            if(currentQIndex >= onedioQuestions.length) {
                document.getElementById('test-title').innerText = "Test Bitti! 🎉";
                document.getElementById('question-text').innerText = "Uyumunuz %100! Birbiriniz için yaratılmışsınız mazoşist bir uyum var aranızda! ❤️✨";
                document.getElementById('test-options').innerHTML = `<button class="btn" onclick="currentQIndex=0; loadOnedioTest();">Testi Baştan Çöz</button>`;
                return;
            }
            let qData = onedioQuestions[currentQIndex];
            document.getElementById('test-title').innerText = `İlişki Testi (${currentQIndex + 1}/${onedioQuestions.length})`;
            document.getElementById('question-text').innerText = qData.q;
            
            let html = "";
            qData.options.forEach((opt, idx) => {
                html += `<button class="option-btn" onclick="nextQuestion()">✨ ${opt}</button>`;
            });
            document.getElementById('test-options').innerHTML = html;
        }

        function nextQuestion() {
            currentQIndex++;
            loadOnedioTest();
        }
        setTimeout(loadOnedioTest, 300);

        // KELİME TÜRETME SİSTEMİ
        let activeWord = "";

        function sendWord() {
            let input = document.getElementById('word-input');
            let word = input.value.trim().toLowerCase();
            if(!word) return;

            if(activeWord && activeWord.length > 0) {
                let lastTwo = activeWord.slice(-2);
                if(!word.startsWith(lastTwo)) {
                    alert(`Kelime "${lastTwo}" hecesiyle başlamalı!`);
                    return;
                }
            }

            activeWord = word;
            document.getElementById('current-word').innerText = word.toUpperCase();
            conn.send({ type: 'kelime', word: word });
            input.value = '';
        }

        function updateWordGame(word) {
            activeWord = word;
            document.getElementById('current-word').innerText = word.toUpperCase();
        }

        // TİC-TAC-TOE (XOX) OYUNU
        let tttBoard = ["", "", "", "", "", "", "", "", ""];
        let myTurn = true; // Oda kuran X başlar, katılan O
        let mySymbol = isHost ? "X" : "O";

        function makeMove(index) {
            if(tttBoard[index] !== "" || !myTurn) return;
            
            tttBoard[index] = isHost ? "X" : "O";
            myTurn = false;
            updateTTTUI();
            
            conn.send({ type: 'ttt', index: index, playerSymbol: isHost ? "X" : "O" });
            checkTTTWinner();
        }

        function receiveMove(index, symbol) {
            tttBoard[index] = symbol;
            myTurn = true;
            updateTTTUI();
            checkTTTWinner();
        }

        function updateTTTUI() {
            let cells = document.querySelectorAll('.ttt-cell');
            cells.forEach((cell, idx) => {
                cell.innerText = tttBoard[idx];
            });
            document.getElementById('ttt-status').innerText = myTurn ? "Sıra sende! 🎯" : "Sevgilinin hamlesi bekleniyor... ⏳";
        }

        function checkTTTWinner() {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for(let combo of wins) {
                let [a,b,c] = combo;
                if(tttBoard[a] && tttBoard[a] === tttBoard[b] && tttBoard[a] === tttBoard[c]) {
                    document.getElementById('ttt-status').innerText = `Kazanan: ${tttBoard[a]}! Tebrikler! 🎉`;
                    myTurn = false;
                    return;
                }
            }
            if(!tttBoard.includes("")) {
                document.getElementById('ttt-status').innerText = "Olay berabere bitti! 🤝";
            }
        }

        function resetTTT() {
            resetTTTBoardLocally();
            conn.send({ type: 'ttt-reset' });
        }

        function resetTTTBoardLocally() {
            tttBoard = ["", "", "", "", "", "", "", "", ""];
            myTurn = isHost ? true : false;
            updateTTTUI();
        }
    </script>
</body>
</html>
